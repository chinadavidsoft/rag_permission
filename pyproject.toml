[project]
name = "rag-permission"
version = "0.1.0"
description = "Permission-aware enterprise knowledge base RAG"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "qdrant-client>=1.12.0",
  "sentence-transformers>=3.0.0",
  "jieba>=0.42.1",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "openai>=1.40.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "reportlab>=4.2.0",
  "httpx>=0.27.0",
  "pyjwt>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_permission"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
