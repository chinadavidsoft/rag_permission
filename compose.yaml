services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      SQLITE_PATH: /app/data/rag_permission.db
      ENABLE_RERANK: ${ENABLE_RERANK:-true}
      AUTH_MODE: ${AUTH_MODE:-jwt}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      PROMPT_COST_PER_1K: ${PROMPT_COST_PER_1K:-0}
      COMPLETION_COST_PER_1K: ${COMPLETION_COST_PER_1K:-0}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - app_data:/app/data

  # Optional hosted embedding alternative:
  # tei:
  #   image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./models:/models
  #   command: ["--model-id", "/models/bge-m3"]

volumes:
  qdrant_storage:
  huggingface_cache:
  app_data:
